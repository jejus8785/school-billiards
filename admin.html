<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>관리자 예약 관리</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="topbar admin-top">
  <div>
    <div class="eyebrow">ADMINISTRATOR</div>
    <h1>당구장 예약 관리</h1>
    <p>전체 예약 현황을 확인하고 필요한 예약을 강제로 취소할 수 있습니다.</p>
  </div>
  <div class="admin-actions">
    <button class="nav-btn primary" onclick="downloadBackup()">예약 데이터 다운로드</button>
    <a class="nav-btn" href="/">학생 화면</a>
    <form method="post" action="/admin/logout"><button class="nav-btn" type="submit">로그아웃</button></form>
  </div>
</header>
<main class="container">
  <div class="stats">
    <div class="stat"><span>전체 예약</span><strong id="total">0</strong></div>
    <div class="stat"><span>예약된 날짜</span><strong id="days">0</strong></div>
    <div class="stat"><span>예약 가능 팀 수</span><strong id="remaining">0</strong></div>
  </div>
  <div class="panel">
    <div class="section-head">
      <div><h2>예약 목록</h2><p class="muted">예약 취소는 되돌릴 수 없으므로 신중하게 처리하세요.</p></div>
      <input id="adminSearch" class="search" placeholder="날짜·이름·학번 검색" oninput="renderAdmin()">
    </div>
    <div id="adminList"></div>
  </div>
</main>
<script>
async function downloadBackup() {
  const r = await fetch('/api/admin/backup');
  if(r.status === 401) { location.href = '/admin'; return; }
  const data = await r.json();
  if(!r.ok) { alert(data.error || '백업 다운로드에 실패했습니다.'); return; }
  
  // JSON 파일로 자동 다운로드 트리거
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const todayStr = new Date().toISOString().slice(0, 10);
  a.download = `billiards_backup_${todayStr}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
</script>
<script src="admin.js"></script>
</body>
</html>
