services:
  - type: web
    name: school-billiards
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: school-billiards-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
databases:
  - name: school-billiards-db
    databaseName: billiards
    user: billiards
    plan: free
